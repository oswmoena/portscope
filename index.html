<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortScope</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div>
          <h1>PortScope</h1>
          <p id="summary" class="muted">Escaneando…</p>
        </div>
      </div>

      <div class="tools">
        <form id="free-port" class="free-port" title="Busca el primer puerto libre desde este número">
          <label for="free-start" class="muted">Desde</label>
          <input id="free-start" type="number" min="1" max="65535" value="3000" />
          <button type="submit" class="btn primary">Puerto libre</button>
          <output id="free-result" class="free-result" hidden></output>
        </form>
        <button id="refresh" class="btn icon" title="Actualizar ahora" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="filters">
      <input id="search" type="search" placeholder="Filtrar por nombre, puerto, framework o carpeta…" autocomplete="off" />
      <label class="toggle">
        <input id="show-system" type="checkbox" />
        <span>Mostrar procesos del sistema</span>
      </label>
    </div>

    <main class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-status"></th>
            <th>App</th>
            <th class="col-pid">PID</th>
            <th>Puerto(s)</th>
            <th class="col-actions">Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </main>

    <section class="log">
      <div class="log-head">
        <span>Actividad</span>
        <button id="clear-log" class="link">Limpiar</button>
      </div>
      <ol id="log"></ol>
    </section>
  </body>
</html>
