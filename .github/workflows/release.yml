name: Release

# Push a tag like v0.1.0 to build installers for macOS and Windows
# and publish them in a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PortScope ${{ github.ref_name }}"
          releaseBody: |
            ## Descargas
            - **macOS** (Apple Silicon + Intel): `PortScope_*_universal.dmg`
            - **Windows**: `PortScope_*_x64-setup.exe` (o el `.msi`)

            > Los instaladores no están firmados con un certificado de desarrollador.
            > - **macOS:** la primera vez, clic derecho en la app → *Abrir*, o en *Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente*.
            > - **Windows:** si aparece SmartScreen, *Más información → Ejecutar de todas formas*.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
